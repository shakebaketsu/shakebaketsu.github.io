<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白黒絵文字タイルクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f3; --fg:#1e1e1e; --panel:#ffffff; --border:#ddd; --accent:#3b7ce0; --warn:#c9612b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#151515;--fg:#eee;--panel:#222;--border:#3a3a3a;--accent:#6ea3ff;--warn:#f0a95c;}
}
:root[data-theme="dark"]{--bg:#151515;--fg:#eee;--panel:#222;--border:#3a3a3a;--accent:#6ea3ff;--warn:#f0a95c;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic UI",sans-serif;overflow:hidden;user-select:none;}
#gearBtn{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--panel);color:var(--fg);
  font-size:1.3rem;cursor:pointer;z-index:5;}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
#centerArea{width:min(84vw,72vh);aspect-ratio:1;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
#answerName{font-size:1rem;font-weight:600;color:var(--fg);min-height:1.4em;opacity:0;transition:opacity .2s ease;text-align:center;padding:0 10px;}
body.state-answer #answerName{opacity:1;}
#displayCanvas{width:100%;height:100%;display:block;}
#timerTrack{position:fixed;left:0;bottom:calc(0px + env(safe-area-inset-bottom,0px));width:50%;height:12px;background:var(--border);border-top-right-radius:8px;overflow:hidden;}
#timerFill{height:100%;width:100%;background:var(--accent);transition:background-color .3s ease;}
#answerBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding:12px 20px;border-radius:12px;border:1px solid var(--border);background:var(--accent);color:#fff;font-size:1rem;cursor:pointer;z-index:5;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10;}
#overlay.hidden{display:none;}
#dialog{background:var(--panel);border-radius:14px;padding:18px 20px;width:min(92vw,440px);max-height:86vh;overflow-y:auto;}
#dialog h2{margin:0 0 12px;font-size:1.05rem;}
.field{margin-bottom:14px;}
.field label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--fg);margin-bottom:4px;}
.field input[type=range]{width:100%;}
.field input[type=number]{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);}
.field textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:.72rem;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);}
.warn{color:var(--warn);font-size:.78rem;margin-top:4px;}
.warn.hidden{display:none;}
#closeSettings,#resetDefaults{margin-top:6px;margin-right:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--accent);color:#fff;cursor:pointer;}
#resetDefaults{background:var(--panel);color:var(--fg);}

#stateLabel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));
  padding:5px 16px;border-radius:999px;font-size:.78rem;font-weight:600;border:1px solid var(--border);
  background:var(--panel);color:var(--fg);z-index:4;transition:background-color .25s,color .25s,border-color .25s;white-space:nowrap;}
body.state-question #stateLabel{border-color:var(--accent);color:var(--accent);}
body.state-hidden #stateLabel{border-color:var(--warn);color:var(--warn);}
body.state-answer #stateLabel{background:#2fa84f;border-color:#2fa84f;color:#fff;}

body.state-question #centerArea{border-color:var(--accent);}
body.state-hidden #centerArea{border-style:dashed;border-color:var(--warn);}
body.state-answer #centerArea{border-color:#2fa84f;border-width:2px;}

body.state-answer #answerBtn{background:#2fa84f;}
</style>
</head>
<body>
<button id="gearBtn" title="設定">⚙</button>
<div id="stage"><div id="centerArea"><canvas id="displayCanvas"></canvas></div><div id="answerName"></div></div>
<div id="stateLabel"></div>
<div id="timerTrack"><div id="timerFill"></div></div>
<button id="answerBtn">答え</button>

<div id="overlay" class="hidden">
  <div id="dialog">
    <h2>設定</h2>
    <div class="field"><label>タイル分割数 N <span id="nVal"></span></label><input type="range" id="nSlider" min="4" max="16" step="1"></div>
    <div class="field"><label>制限時間 T(秒) <span id="tVal"></span></label><input type="range" id="tSlider" min="5" max="30" step="0.1"></div>
    <div class="field"><label>フレーム総数 F <span id="fVal"></span></label><input type="range" id="fSlider" min="3" max="10" step="1"></div>
    <div class="field"><label>初期フレーム間隔 Is(秒)</label><input type="number" id="isInput" step="0.01"></div>
    <div class="field"><label>最終フレーム間隔 Ie(秒)</label><input type="number" id="ieInput" step="0.01"></div>
    <div class="field"><label>対象絵文字ユニコード</label><textarea id="emojiListInput"></textarea></div>
    <button id="resetDefaults">デフォルトに戻す</button>
    <button id="closeSettings">閉じる</button>
  </div>
</div>

function parseEmojiText(text){
  const out=[];
  text.trim().split(/\s+/).filter(Boolean).forEach(tok=>{
    const groups=[...tok.matchAll(/U\+([0-9A-Fa-f]+)/gi)].map(m=>parseInt(m[1],16));
    if(groups.length===0) return;
    if(groups.length===1){ out.push([groups[0]]); return; }
    // groups.length >= 2: decide range ("-") vs multi-codepoint ("+") by checking
    // the character right after the FIRST "U+XXXX" group, not by tok.includes('+')
    // (every token contains a '+' from "U+" itself, so that check was always true).
    const firstGroupMatch=tok.match(/U\+[0-9A-Fa-f]+/i)[0];
    const sep=tok[firstGroupMatch.length];
    if(sep==='-'){
      const start=groups[0], end=groups[groups.length-1];
      for(let cp=start; cp<=end; cp++) out.push([cp]);
    } else {
      out.push(groups);
    }
  });
  return out;
}

function keyOf(cps){return cps.join(',');}
function nameFor(cps){ return EMOJI_NAMES[keyOf(cps)] || '(名称不明)'; }
function pickEmoji(){
  const recentSet=new Set(recent);
  let candidates=pool.filter(e=>!recentSet.has(keyOf(e)) && !knownBad.has(keyOf(e)));
  if(candidates.length===0) candidates=pool.filter(e=>!recentSet.has(keyOf(e)));
  if(candidates.length===0) candidates=pool;
  if(candidates.length===0) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}

function buildRenderString(cps){
  return String.fromCodePoint(...cps);
}

function renderToCanvas(ctx, size, cps){
  ctx.clearRect(0,0,size,size);
  ctx.font=`${size*0.8}px "Noto Emoji"`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(buildRenderString(cps), size/2, size/2+size*0.02);
}

function canvasHasColor(canvas){
  const c=canvas.getContext('2d');
  const data=c.getImageData(0,0,canvas.width,canvas.height).data;
  let colorPixels=0;
  for(let i=0;i<data.length;i+=4){
    const a=data[i+3];
    if(a<20) continue;
    const r=data[i],g=data[i+1],b=data[i+2];
    // 本来のNoto Emoji(無彩色)描画ならR=G=Bになるはずなので、閾値は厳しめにする。
    // ただし1ピクセルだけの誤差で誤判定しないよう、まとまった数を超えたらtrueにする。
    if(Math.max(r,g,b)-Math.min(r,g,b)>6){
      colorPixels++;
      if(colorPixels>3) return true;
    }
  }
  return false;
}

function canvasSignature(canvas){
  const c=canvas.getContext('2d');
  const data=c.getImageData(0,0,canvas.width,canvas.height).data;
  let hash=0;
  for(let i=3;i<data.length;i+=4){ hash=(hash*31+data[i])>>>0; } // アルファチャンネルの並びをハッシュ化
  return hash;
}

// フォントが対応していない文字を描くと出る"お豆腐"は、環境によって微妙に見た目(フォールバック先)が
// 異なることがあるため、Unicodeで恒久的に未割当が保証されている複数のノンキャラクタ/私用領域文字を
// 描画してそれぞれの見た目を基準として持っておき、どれか1つにでも一致したら「未対応」と判定する。
let tofuSignatures=[];
function computeTofuSignatures(){
  const refs=[0xFFFE, 0xFFFF, 0xFDD0, 0x10FFFD, 0x10FFFE];
  tofuSignatures=refs.map(cp=>{
    renderToCanvas(fullCtx, SIZE, [cp]);
    return canvasSignature(fullCanvas);
  });
}

// フォントの適用/グリフ確定が遅れてカラー版が一瞬描かれることがあるため、
// 白黒判定→カラーなら再描画、を数フレーム待ちながら繰り返す。
// お豆腐(未対応グリフ)は待っても変化しないので即座に'tofu'として返す。
async function renderUntilMono(ctx, canvas, cps, maxTries=40){
  for(let i=0;i<maxTries;i++){
    renderToCanvas(ctx, canvas.width, cps);
    const sig=canvasSignature(canvas);
    if(tofuSignatures.includes(sig)) return 'tofu';
    if(!canvasHasColor(canvas)) return 'ok';
    await new Promise(r=>requestAnimationFrame(r));
  }
  return 'color';
}

// pickEmoji()で候補を引いては検証、を成功するまで繰り返す(失敗した候補はknownBadへ)
async function prepareCandidate(ctx, canvas){
  const maxAttempts=pool.length+5;
  for(let tries=0; tries<maxAttempts; tries++){
    const cand=pickEmoji();
    if(!cand) return null;
    const result=await renderUntilMono(ctx, canvas, cand);
    if(result==='ok') return cand;
    knownBad.add(keyOf(cand));
  }
  return null;
}

let colorTable=[]; // colorTable[y][x] = このマスが表示されるFcの値(縦横隣接マスとは必ず異なる値になる)

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function tryBuildColoring(N,F){
  const table=Array.from({length:N},()=>new Array(N).fill(-1));
  const order=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) order.push([x,y]);
  shuffle(order);
  for(const [x,y] of order){
    const forbidden=new Set();
    if(x>0 && table[y][x-1]>=0) forbidden.add(table[y][x-1]);
    if(x<N-1 && table[y][x+1]>=0) forbidden.add(table[y][x+1]);
    if(y>0 && table[y-1][x]>=0) forbidden.add(table[y-1][x]);
    if(y<N-1 && table[y+1][x]>=0) forbidden.add(table[y+1][x]);
    const available=[];
    for(let c=0;c<F;c++) if(!forbidden.has(c)) available.push(c);
    if(available.length===0) return null; // 詰んだ→やり直し
    table[y][x]=available[Math.floor(Math.random()*available.length)];
  }
  return table;
}

function buildValidColoring(N,F,maxAttempts=300){
  for(let i=0;i<maxAttempts;i++){
    const t=tryBuildColoring(N,F);
    if(t) return t;
  }
  // 最終手段: 縦横隣接の非衝突だけは必ず満たす単純式(斜め線状にはなるが安全策)
  const table=Array.from({length:N},()=>new Array(N).fill(0));
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) table[y][x]=(x+y)%F;
  return table;
}

function regenerateColorTable(){
  colorTable=buildValidColoring(settings.N, settings.F);
}

        dispCtx.drawImage(fullCanvas, sx,sy,tile,tile, sx,sy,tile,tile);

      chosenCps=preloaded.cps;
      fullCtx.clearRect(0,0,SIZE,SIZE);
      fullCtx.drawImage(preloadCanvas,0,0);

    } else {
      chosenCps=await prepareCandidate(fullCtx, fullCanvas); // 先読みが無い/失敗した場合はその場で用意
    }

  if(!chosenCps) chosenCps=pool[0]; // 全滅した場合の最終フォールバック

  currentEmoji=chosenCps;
  markShown(currentEmoji);

  elapsed=0; Fc=0; phaseAccum=0; lastTs=null;
  imageReady=true;
  if(state==='question') drawMask();

  preloadNext(); // 今回の出題中に次を先読みしておく

function loop(ts){
  requestAnimationFrame(loop);
  if(lastTs===null) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;

  if(state==='question' && imageReady){
    elapsed=Math.min(settings.T, elapsed+dt);
    const remainFrac=Math.max(0,(1-elapsed/settings.T));
    timerFill.style.width=`${remainFrac*100}%`;
    timerFill.style.background = remainFrac<0.25 ? 'var(--warn)' : 'var(--accent)';

    const interval=Math.max(0.001, currentInterval());
    phaseAccum+=dt/interval;
    let changed=false;
    while(phaseAccum>=1){
      phaseAccum-=1;
      Fc=(Fc+1)%settings.F;
      changed=true;
    }
    if(changed) drawMask();

    if(elapsed>=settings.T){
      state='hidden';
      clearDisplay();
      applyStateUI();
    }
  }
}
requestAnimationFrame(loop);

function applyStateUI(){
  document.body.classList.remove('state-question','state-hidden','state-answer');
  document.body.classList.add('state-'+state);
  const label=document.getElementById('stateLabel');
  if(state==='question') label.textContent='🕐 問題表示中';
  else if(state==='hidden') label.textContent='⏳ タイムアップ';
  else label.textContent='✅ こたえ';
}

const answerNameEl=document.getElementById('answerName');

answerBtn.addEventListener('click', ()=>{
  if(state==='answer'){
    startQuestion();
  } else {
    state='answer';
    answerBtn.textContent='次の問題';
    drawFullAnswer();
    answerNameEl.textContent=nameFor(currentEmoji);
    applyStateUI();
  }
});

// --- Settings dialog wiring ---
const overlay=document.getElementById('overlay');
const gearBtn=document.getElementById('gearBtn');
const closeSettings=document.getElementById('closeSettings');
const nSlider=document.getElementById('nSlider'), nVal=document.getElementById('nVal');
const tSlider=document.getElementById('tSlider'), tVal=document.getElementById('tVal');
const fSlider=document.getElementById('fSlider'), fVal=document.getElementById('fVal');
const isInput=document.getElementById('isInput');
const ieInput=document.getElementById('ieInput');
const emojiListInput=document.getElementById('emojiListInput');
const resetDefaults=document.getElementById('resetDefaults');

function refreshDialogUI(){
  nSlider.value=settings.N; nVal.textContent=settings.N;
  tSlider.value=settings.T; tVal.textContent=settings.T.toFixed(1);
  fSlider.value=settings.F; fVal.textContent=settings.F;
  isInput.value=settings.Is;
  ieInput.value=settings.Ie;
  emojiListInput.value=settings.emojiListText;
}

gearBtn.addEventListener('click', ()=>{ refreshDialogUI(); overlay.classList.remove('hidden'); });
closeSettings.addEventListener('click', ()=> overlay.classList.add('hidden'));
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.add('hidden'); });

nSlider.addEventListener('input', ()=>{ settings.N=parseInt(nSlider.value,10); nVal.textContent=settings.N; saveSettings(); regenerateColorTable(); if(state==='question') drawMask(); else if(state==='answer') drawFullAnswer(); });
tSlider.addEventListener('input', ()=>{ settings.T=parseFloat(tSlider.value); tVal.textContent=settings.T.toFixed(1); saveSettings(); });
fSlider.addEventListener('input', ()=>{ settings.F=parseInt(fSlider.value,10); fVal.textContent=settings.F; Fc=Fc%settings.F; saveSettings(); regenerateColorTable(); if(state==='question') drawMask(); });
isInput.addEventListener('change', ()=>{ settings.Is=parseFloat(isInput.value)||0; saveSettings(); });
ieInput.addEventListener('change', ()=>{ settings.Ie=parseFloat(ieInput.value)||0; saveSettings(); });
emojiListInput.addEventListener('change', ()=>{
  settings.emojiListText=emojiListInput.value;
  pool=parseEmojiText(settings.emojiListText);
  recent=[];
  knownBad=new Set();
  preloaded=null; preloadingPromise=null;
  saveSettings();
});
resetDefaults.addEventListener('click', ()=>{
  settings={...DEFAULTS};
  saveSettings();
  pool=parseEmojiText(settings.emojiListText);
  recent=[];
  knownBad=new Set();
  preloaded=null; preloadingPromise=null;
  refreshDialogUI();
  regenerateColorTable();
  startQuestion();
});

// --- init ---
(async ()=>{
  try{ await document.fonts.load('400 400px "Noto Emoji"'); }catch(e){}
  await document.fonts.ready;
  computeTofuSignatures();
  regenerateColorTable();
  await startQuestion();
})();
</script>
