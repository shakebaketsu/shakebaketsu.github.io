<!DOCTYPE html>
<html>

<body>
    <button id="connect">接続してモーター回す</button>
    <div id="status"></div>

    <script>
        const SERVICE_UUID = '0000ffa0-0000-1000-8000-00805f9b34fb';
        const CHAR_UUID = "0000ffa1-0000-1000-8000-00805f9b34fb";
        const DATA1 = new Uint8Array([0xa0, 0x03, 0x00, 0x00, 0x00, 0x00, 0xaa]);
        const DATA2 = new Uint8Array([0xa0, 0x03, 0xff, 0x00, 0x00, 0x00, 0xaa]);

        document.getElementById('connect').addEventListener('click', async () => {
            try {
                const status = document.getElementById('status');
                status.innerText = "デバイスを選択中...";

                // const device = await navigator.bluetooth.requestDevice({
                //     filters: [{ services: [SERVICE_UUID] }]
                // });
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const char = await service.getCharacteristic(CHAR_UUID);

                status.innerText = "送信中 (20ms間隔)...";

                // 高精度を狙うためのループ
                let count = 0;
                setInterval(() => {
                    // response=False 相当の書き込み
                    char.writeValueWithoutResponse(count % 2 ? DATA1 : DATA2);
                    count++;
                }, 20);

            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "エラー: " + err;
            }
        });
    </script>
</body>

</html>
